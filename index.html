<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>品出し管理ツール</title>
    <style>
        :root { --font-scale: 1; }

        body {
            font-family: sans-serif;
            padding: 20px;
            font-size: calc(18px * var(--font-scale));
            touch-action: manipulation;
        }

        .version-info { margin-bottom: 15px; }

        .mode-controls,
        .sheet-controls,
        .font-controls {
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        button {
            padding: 15px 25px;
            font-size: calc(20px * var(--font-scale));
            cursor: pointer;
            touch-action: manipulation;
        }

        .mode-btn {
            flex: 1;
            min-width: 130px;
            border: 2px solid #777;
            background: #f0f0f0;
        }

        .mode-btn.active {
            background: #333;
            color: white;
            border-color: #333;
        }

        .load-btn {
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }

        .reload-btn {
            background: #e9ecef;
            border: 1px solid #999;
            border-radius: 5px;
        }

        .edit-btn {
            display: inline-block;
            padding: 12px 18px;
            background: #f0f0f0;
            color: #222;
            text-decoration: none;
            border: 1px solid #999;
            border-radius: 5px;
            font-size: calc(16px * var(--font-scale));
        }

        .file-input {
            margin-bottom: 20px;
            padding: 10px;
            background: #f0f0f0;
        }

        .status {
            min-height: 1.5em;
            margin: 10px 0 20px;
            font-weight: bold;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            border-bottom: 2px solid #ccc;
            padding: 15px 0;
        }

        .product-info {
            font-size: calc(20px * var(--font-scale));
            font-weight: bold;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .count-input {
            font-size: calc(24px * var(--font-scale));
            font-weight: bold;
            width: calc(60px * var(--font-scale));
            text-align: center;
            border: 1px solid #999;
            padding: 5px;
        }

        .reset-btn {
            background: #ff4444;
            color: white;
            width: 100%;
            padding: 20px;
            font-size: calc(20px * var(--font-scale));
            border: none;
            margin: 10px 0 20px;
        }

        #newProductName {
            width: 60%;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 18px;
            padding: 10px;
        }

        .current-mode {
            margin-bottom: 10px;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body { padding: 12px; }

            .mode-btn,
            .load-btn,
            .reload-btn {
                width: 100%;
            }

            #newProductName {
                width: calc(100% - 22px);
                margin-bottom: 8px;
            }
        }
    </style>
</head>
<body>

<h1>品出し管理ツール</h1>

<div class="mode-controls">
    <button id="drinkModeBtn" class="mode-btn" onclick="switchMode('drink')">飲料モード</button>
    <button id="alcoholModeBtn" class="mode-btn" onclick="switchMode('alcohol')">酒モード</button>
</div>

<div id="currentMode" class="current-mode"></div>

<div class="sheet-controls">
    <button class="load-btn" onclick="loadCurrentSheet()">現在のモードのリストを取得</button>
    <button class="reload-btn" onclick="loadCurrentSheet()">現在のリストを再読み込み</button>
</div>

<div class="font-controls">
    <span>文字サイズ変更:</span>
    <button onclick="changeFontSize(-0.1)">小</button>
    <button onclick="changeFontSize(0.1)">大</button>
</div>

<div class="file-input">
    自前のCSVを現在のモードに読み込む：
    <input type="file" id="csvFile" accept=".csv,text/csv">
</div>

<div id="status" class="status"></div>

<button class="reset-btn" onclick="resetCounts()">現在のモードの補充数をリセット</button>

<div id="list"></div>

<script>
    const SHEETS = {
    drink: {
        label: '飲料',
        csvUrl: 'https://docs.google.com/spreadsheets/d/1Vp6SGHcbn-bjvlTrsVJjfhKSLOToyZaCEMABVIoXBm8/gviz/tq?tqx=out:csv'
    },
    alcohol: {
        label: '酒',
        csvUrl: 'https://docs.google.com/spreadsheets/d/1OF8sG01LuwRwwxzsJibkrZY1uwJruYqSPkVr2PzAhAE/gviz/tq?tqx=out:csv'
    }
    
    };

    let currentMode = localStorage.getItem('currentMode') || 'drink';

    let fontScale = parseFloat(localStorage.getItem('fontScale') || '1.0');
    document.documentElement.style.setProperty('--font-scale', fontScale);

    function storageKey(mode = currentMode) {
        return `products_${mode}`;
    }

    function getProducts(mode = currentMode) {
        try {
            return JSON.parse(localStorage.getItem(storageKey(mode)) || '[]');
        } catch {
            return [];
        }
    }

    function saveProducts(products, mode = currentMode) {
        localStorage.setItem(storageKey(mode), JSON.stringify(products));
    }

    function changeFontSize(delta) {
        fontScale = Math.min(Math.max(0.7, fontScale + delta), 2.0);
        localStorage.setItem('fontScale', fontScale);
        document.documentElement.style.setProperty('--font-scale', fontScale);
        render();
    }

    function switchMode(mode) {
        currentMode = mode;
        localStorage.setItem('currentMode', currentMode);
        setStatus('');
        updateModeUI();
        render();
    }

    function updateModeUI() {
        document.getElementById('drinkModeBtn').classList.toggle('active', currentMode === 'drink');
        document.getElementById('alcoholModeBtn').classList.toggle('active', currentMode === 'alcohol');

        document.getElementById('currentMode').textContent =
            `現在のモード：${SHEETS[currentMode].label}`;

    }

    function setStatus(message, isError = false) {
        const status = document.getElementById('status');
        status.textContent = message;
        status.style.color = isError ? '#c00' : '#176b2c';
    }

    function parseCsvLine(line) {
        const values = [];
        let value = '';
        let insideQuotes = false;

        for (let i = 0; i < line.length; i++) {
            const char = line[i];

            if (char === '"') {
                if (insideQuotes && line[i + 1] === '"') {
                    value += '"';
                    i++;
                } else {
                    insideQuotes = !insideQuotes;
                }
            } else if (char === ',' && !insideQuotes) {
                values.push(value);
                value = '';
            } else {
                value += char;
            }
        }

        values.push(value);
        return values;
    }

    function csvToNames(csvText) {
        return csvText
            .replace(/^\uFEFF/, '')
            .split(/\r?\n/)
            .filter(line => line.trim() !== '')
            .map(line => parseCsvLine(line)[0].trim())
            .filter(name => name !== '');
    }

    function mergeWithExistingCounts(names) {
        const existing = getProducts();
        const counts = new Map();

        existing.forEach(product => {
            if (!counts.has(product.name)) {
                counts.set(product.name, product.count || 0);
            }
        });

        return names.map(name => ({
            name,
            count: counts.get(name) || 0
        }));
    }

    async function loadCurrentSheet() {
        const sheet = SHEETS[currentMode];
        setStatus(`${sheet.label}リストを読み込み中...`);

        try {
            const response = await fetch(sheet.csvUrl, { cache: 'no-store' });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }

            const csvText = await response.text();
            const names = csvToNames(csvText);

            if (names.length === 0) {
                throw new Error('商品データが見つからなかった');
            }

            const products = mergeWithExistingCounts(names);
            saveProducts(products);
            render();

            setStatus(`${sheet.label}リストを更新した（${products.length}件）`);
        } catch (error) {
            console.error(error);
            setStatus(
                `${sheet.label}リストの取得に失敗した。GitHub上に対象のCSVファイルが存在するか、ファイル名を確認してください。`,
                true
            );
        }
    }

    function render() {
        const products = getProducts();
        const listDiv = document.getElementById('list');
        listDiv.innerHTML = '';

        if (products.length === 0) {
            const empty = document.createElement('div');
            empty.textContent =
                '商品リストがまだ読み込まれていません。GitHub上のCSVまたは自前のCSVから読み込んでください。';
            empty.style.margin = '20px 0';
            listDiv.appendChild(empty);
        }

        products.forEach((p, index) => {
            const card = document.createElement('div');
            card.className = 'product-card';

            const info = document.createElement('div');
            info.className = 'product-info';

            // 商品名中の半角・全角スペースを改行として表示する。
            const parts = String(p.name).split(/[ 　]+/);
            parts.forEach((part, partIndex) => {
                if (partIndex > 0) info.appendChild(document.createElement('br'));
                info.appendChild(document.createTextNode(part));
            });

            const controls = document.createElement('div');
            controls.className = 'controls';

            const minus = document.createElement('button');
            minus.textContent = '-';
            minus.onclick = () => updateCount(index, -1);

            const input = document.createElement('input');
            input.type = 'number';
            input.className = 'count-input';
            input.value = p.count || 0;
            input.min = '0';
            input.onchange = e => setManualCount(index, e.target.value);

            const plus = document.createElement('button');
            plus.textContent = '+';
            plus.onclick = () => updateCount(index, 1);

            const reset = document.createElement('button');
            reset.textContent = '0';
            reset.style.background = '#ffcccc';
            reset.onclick = () => resetSingleCount(index);

            controls.append(minus, input, plus, reset);
            card.append(info, controls);
            listDiv.appendChild(card);
        });

        const addDiv = document.createElement('div');
        addDiv.style.marginTop = '30px';

        const title = document.createElement('div');
        title.style.fontWeight = 'bold';
        title.style.marginBottom = '5px';
        title.textContent = `${SHEETS[currentMode].label}モードに商品を追加:`;

        const input = document.createElement('input');
        input.type = 'text';
        input.id = 'newProductName';
        input.placeholder = '商品名を入力';
        input.addEventListener('keydown', event => {
            if (event.key === 'Enter') addProduct();
        });

        const button = document.createElement('button');
        button.textContent = '追加';
        button.onclick = addProduct;

        addDiv.append(title, input, button);
        listDiv.appendChild(addDiv);
    }

    function addProduct() {
        const nameInput = document.getElementById('newProductName');
        const name = nameInput.value.trim();

        if (!name) return;

        const products = getProducts();
        products.push({ name, count: 0 });
        saveProducts(products);
        render();
    }

    document.getElementById('csvFile').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const modeAtSelection = currentMode;
        const reader = new FileReader();

        reader.onload = function(loadEvent) {
            const names = csvToNames(loadEvent.target.result);

            if (names.length === 0) {
                setStatus('CSV内に商品データが見つからなかった。', true);
                return;
            }

            const existing = getProducts(modeAtSelection);
            const counts = new Map(existing.map(p => [p.name, p.count || 0]));

            const products = names.map(name => ({
                name,
                count: counts.get(name) || 0
            }));

            saveProducts(products, modeAtSelection);

            if (currentMode === modeAtSelection) {
                render();
            }

            setStatus(
                `${SHEETS[modeAtSelection].label}モードにCSVを読み込んだ（${products.length}件）`
            );

            event.target.value = '';
        };

        reader.onerror = function() {
            setStatus('CSVファイルの読み込みに失敗した。', true);
        };

        reader.readAsText(file, 'UTF-8');
    });

    function updateCount(index, delta) {
        const products = getProducts();
        if (!products[index]) return;

        products[index].count =
            Math.max(0, (parseInt(products[index].count, 10) || 0) + delta);

        saveProducts(products);
        render();
    }

    function setManualCount(index, value) {
        const products = getProducts();
        if (!products[index]) return;

        products[index].count = Math.max(0, parseInt(value, 10) || 0);
        saveProducts(products);
        render();
    }

    function resetCounts() {
        const products = getProducts();
        products.forEach(p => p.count = 0);
        saveProducts(products);
        render();
    }

    function resetSingleCount(index) {
        const products = getProducts();
        if (!products[index]) return;

        products[index].count = 0;
        saveProducts(products);
        render();
    }

    function searchProduct() {
    const keyword = document.getElementById('searchInput').value.trim();
    if (!keyword) return;

    const products = getProducts();

    const index = products.findIndex(product =>
        product.name.toLowerCase().includes(keyword.toLowerCase())
    );

    if (index === -1) {
        setStatus(`「${keyword}」に一致する商品が見つからなかった。`, true);
        return;
    }

    const card = document.getElementById(`product-${index}`);

    card.scrollIntoView({
        behavior: 'smooth',
        block: 'center'
    });
    
    }

    // 旧版で products に保存されていたデータがある場合は、
    // 初回のみ飲料モードへ引き継ぐ。
    (function migrateOldData() {
        const oldProducts = localStorage.getItem('products');
        const drinkProducts = localStorage.getItem('products_drink');

        if (oldProducts && !drinkProducts) {
            localStorage.setItem('products_drink', oldProducts);
        }
    })();

    updateModeUI();
    render();
</script>

</body>
</html>
